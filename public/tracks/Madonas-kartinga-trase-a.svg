<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <!-- Master Track Geometry -->
    <path id="kart-track-6" pathLength="1000" d="
      M 542, 130
      L 395, 130
      C 360, 130, 338, 148, 312, 148
      C 282, 148, 260, 132, 232, 122
      C 205, 114, 185, 118, 155, 132
      L 105, 155
      C 82, 166, 80, 188, 108, 190
      L 215, 185
      C 248, 184, 262, 200, 248, 218
      C 235, 234, 208, 242, 175, 242
      L 95, 238
      C 65, 238, 52, 262, 72, 278
      C 92, 290, 165, 292, 215, 290
      C 265, 286, 305, 278, 345, 258
      L 385, 240
      C 412, 228, 430, 236, 435, 262
      L 440, 292
      C 446, 315, 495, 318, 515, 305
      C 532, 292, 538, 268, 545, 230
      L 552, 195
      C 558, 168, 608, 168, 625, 192
      C 638, 210, 655, 255, 675, 310
      L 702, 385
      C 710, 400, 725, 402, 755, 402
      L 872, 398
      C 902, 396, 905, 365, 880, 352
      L 832, 326
      C 812, 314, 808, 298, 806, 265
      C 804, 235, 795, 215, 775, 180
      C 755, 146, 725, 130, 680, 130
      L 542, 130
      Z" />

    <!-- Neon Orange Glow Filter -->
    <filter id="neon-orange-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Track (White) -->
  <use href="#kart-track-6" fill="none" stroke="#f0f4f8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Start/Finish Line -->
  <line x1="542" y1="105" x2="542" y2="155" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

  <!-- Layered Fading Neon Orange Trail (Counter-Clockwise) -->
  <!-- Layer 1: Faintest, longest tail -->
  <use href="#kart-track-6" fill="none" stroke="#ff4500" stroke-width="3.5" stroke-linecap="round" opacity="0.2" stroke-dasharray="160 840">
    <animate attributeName="stroke-dashoffset" from="160" to="-840" dur="8s" repeatCount="indefinite" />
  </use>

  <!-- Layer 2: Mid-tail -->
  <use href="#kart-track-6" fill="none" stroke="#ff5500" stroke-width="5" stroke-linecap="round" opacity="0.45" stroke-dasharray="110 890">
    <animate attributeName="stroke-dashoffset" from="110" to="-890" dur="8s" repeatCount="indefinite" />
  </use>

  <!-- Layer 3: Bright inner tail -->
  <use href="#kart-track-6" fill="none" stroke="#ff6a00" stroke-width="6.5" stroke-linecap="round" opacity="0.75" filter="url(#neon-orange-glow)" stroke-dasharray="65 935">
    <animate attributeName="stroke-dashoffset" from="65" to="-935" dur="8s" repeatCount="indefinite" />
  </use>

  <!-- Layer 4: Intense core tail right behind the ball -->
  <use href="#kart-track-6" fill="none" stroke="#ff9900" stroke-width="8" stroke-linecap="round" opacity="0.95" filter="url(#neon-orange-glow)" stroke-dasharray="25 975">
    <animate attributeName="stroke-dashoffset" from="25" to="-975" dur="8s" repeatCount="indefinite" />
  </use>

  <!-- Moving Neon Orange Ball (Counter-Clockwise) -->
  <g filter="url(#neon-orange-glow)">
    <circle r="8" fill="#ff5500" />
    <circle r="4" fill="#ffffff" />
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#kart-track-6" />
    </animateMotion>
  </g>
</svg>