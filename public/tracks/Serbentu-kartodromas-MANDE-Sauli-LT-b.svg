<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 605 375" width="100%" height="100%">
  <defs>
    <!-- Master Track Geometry -->
    <path id="kart-track-9" pathLength="1000" d="
      M 428, 214
      L 475, 214
      C 505, 214, 520, 232, 515, 255
      C 510, 278, 485, 285, 465, 274
      C 442, 262, 426, 275, 430, 305
      C 435, 338, 465, 344, 505, 338
      C 545, 332, 560, 315, 566, 275
      L 574, 218
      C 578, 192, 562, 182, 525, 180
      L 355, 174
      C 322, 172, 310, 155, 314, 125
      C 318, 92, 342, 80, 378, 92
      L 525, 142
      C 562, 154, 578, 144, 575, 112
      L 570, 65
      C 566, 38, 550, 34, 515, 38
      C 475, 42, 445, 45, 405, 43
      L 315, 40
      C 285, 40, 274, 52, 274, 82
      L 272, 138
      C 272, 165, 255, 172, 222, 170
      C 192, 168, 175, 162, 155, 152
      C 138, 144, 125, 148, 110, 160
      C 92, 174, 72, 168, 65, 145
      C 58, 122, 65, 88, 92, 72
      C 118, 58, 152, 68, 168, 92
      C 182, 114, 208, 118, 222, 102
      C 238, 84, 232, 52, 195, 38
      C 155, 24, 95, 22, 58, 38
      C 32, 50, 26, 82, 26, 135
      C 26, 182, 38, 208, 65, 212
      C 88, 215, 102, 202, 118, 192
      C 134, 182, 152, 186, 178, 196
      C 205, 206, 235, 214, 275, 214
      L 428, 214
      Z" />

    <!-- Neon Orange Glow Filter -->
    <filter id="neon-orange-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Track (White) -->
  <use href="#kart-track-9" fill="none" stroke="#f0f4f8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Start/Finish Line -->
  <line x1="428" y1="196" x2="428" y2="232" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Layered Fading Neon Orange Trail (Reverse Direction) -->
  <!-- Layer 1: Faintest, longest tail -->
  <use href="#kart-track-9" fill="none" stroke="#ff4500" stroke-width="2.5" stroke-linecap="round" opacity="0.2" stroke-dasharray="160 840">
    <animate attributeName="stroke-dashoffset" from="0" to="1000" dur="8s" repeatCount="indefinite" />
  </use>

  <!-- Layer 2: Mid-tail -->
  <use href="#kart-track-9" fill="none" stroke="#ff5500" stroke-width="4" stroke-linecap="round" opacity="0.45" stroke-dasharray="110 890">
    <animate attributeName="stroke-dashoffset" from="0" to="1000" dur="8s" repeatCount="indefinite" />
  </use>

  <!-- Layer 3: Bright inner tail -->
  <use href="#kart-track-9" fill="none" stroke="#ff6a00" stroke-width="5" stroke-linecap="round" opacity="0.75" filter="url(#neon-orange-glow)" stroke-dasharray="65 935">
    <animate attributeName="stroke-dashoffset" from="0" to="1000" dur="8s" repeatCount="indefinite" />
  </use>

  <!-- Layer 4: Intense core tail right behind the ball -->
  <use href="#kart-track-9" fill="none" stroke="#ff9900" stroke-width="6" stroke-linecap="round" opacity="0.95" filter="url(#neon-orange-glow)" stroke-dasharray="25 975">
    <animate attributeName="stroke-dashoffset" from="0" to="1000" dur="8s" repeatCount="indefinite" />
  </use>

  <!-- Moving Neon Orange Ball (Reverse Direction) -->
  <g filter="url(#neon-orange-glow)">
    <circle r="6.5" fill="#ff5500" />
    <circle r="3.2" fill="#ffffff" />
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto" keyPoints="1;0" keyTimes="0;1" calcMode="linear">
      <mpath href="#kart-track-9" />
    </animateMotion>
  </g>
</svg>