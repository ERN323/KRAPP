<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 448" width="100%" height="100%">
  <defs>
    <!-- Master Track Geometry -->
    <path id="kart-track-4" pathLength="1000" d="
      M 558, 402
      L 305, 402
      C 282, 402, 272, 385, 282, 362
      C 288, 348, 305, 338, 330, 322
      L 495, 225
      C 512, 214, 520, 198, 524, 172
      C 528, 148, 520, 122, 495, 118
      C 472, 115, 460, 132, 452, 165
      C 444, 190, 430, 202, 402, 214
      L 295, 255
      C 272, 264, 252, 260, 238, 245
      C 222, 228, 222, 208, 234, 182
      L 260, 130
      C 270, 105, 255, 82, 228, 82
      C 202, 82, 186, 98, 174, 128
      L 116, 265
      C 104, 290, 82, 298, 62, 282
      C 46, 268, 44, 248, 44, 215
      L 46, 68
      C 46, 38, 65, 25, 98, 25
      L 420, 25
      C 455, 25, 490, 46, 515, 46
      C 540, 46, 560, 22, 585, 22
      C 608, 22, 628, 38, 655, 62
      L 702, 102
      C 716, 114, 722, 130, 726, 155
      L 742, 235
      C 748, 262, 765, 274, 795, 272
      L 878, 268
      C 912, 266, 928, 285, 915, 315
      C 902, 342, 868, 372, 838, 392
      C 822, 402, 800, 402, 765, 402
      L 558, 402
      Z" />

    <!-- Neon Orange Glow Filter -->
    <filter id="neon-orange-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Track (White) -->
  <use href="#kart-track-4" fill="none" stroke="#f0f4f8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Start/Finish Line -->
  <line x1="558" y1="372" x2="558" y2="432" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

  <!-- Layered Fading Neon Orange Trail (Clockwise) -->
  <!-- Layer 1: Faintest, longest tail -->
  <use href="#kart-track-4" fill="none" stroke="#ff4500" stroke-width="3.5" stroke-linecap="round" opacity="0.2" stroke-dasharray="160 840">
    <animate attributeName="stroke-dashoffset" from="160" to="-840" dur="8s" repeatCount="indefinite" />
  </use>

  <!-- Layer 2: Mid-tail -->
  <use href="#kart-track-4" fill="none" stroke="#ff5500" stroke-width="5" stroke-linecap="round" opacity="0.45" stroke-dasharray="110 890">
    <animate attributeName="stroke-dashoffset" from="110" to="-890" dur="8s" repeatCount="indefinite" />
  </use>

  <!-- Layer 3: Bright inner tail -->
  <use href="#kart-track-4" fill="none" stroke="#ff6a00" stroke-width="6.5" stroke-linecap="round" opacity="0.75" filter="url(#neon-orange-glow)" stroke-dasharray="65 935">
    <animate attributeName="stroke-dashoffset" from="65" to="-935" dur="8s" repeatCount="indefinite" />
  </use>

  <!-- Layer 4: Intense core tail right behind the ball -->
  <use href="#kart-track-4" fill="none" stroke="#ff9900" stroke-width="8" stroke-linecap="round" opacity="0.95" filter="url(#neon-orange-glow)" stroke-dasharray="25 975">
    <animate attributeName="stroke-dashoffset" from="25" to="-975" dur="8s" repeatCount="indefinite" />
  </use>

  <!-- Moving Neon Orange Ball (Clockwise) -->
  <g filter="url(#neon-orange-glow)">
    <circle r="8" fill="#ff5500" />
    <circle r="4" fill="#ffffff" />
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#kart-track-4" />
    </animateMotion>
  </g>
</svg>